<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 54px;
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 22px;
      fill: #94a3b8;
      letter-spacing: 1.5px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #e2e8f0;
    }
    .pulse-circle {
      animation: pulse 3s ease-in-out infinite alternate;
    }
    .float-node {
      animation: float 4s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { r: 6px; opacity: 0.4; }
      100% { r: 12px; opacity: 0.9; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Decorative Grid & Floating Geometric Elements -->
  <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="800" y1="0" x2="800" y2="300"/>
    <line x1="1000" y1="0" x2="1000" y2="300"/>
  </g>

  <!-- Animated Dynamic Mesh Network Illustration -->
  <g class="float-node">
    <path d="M 900 80 L 1050 140 L 980 230 L 850 190 Z" fill="url(#accentGrad)" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="900" y1="80" x2="980" y2="230" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
    <line x1="1050" y1="140" x2="850" y2="190" stroke="#c084fc" stroke-width="1" opacity="0.6"/>
    
    <circle cx="900" cy="80" r="8" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="1050" cy="140" r="10" fill="#818cf8" filter="url(#glow)"/>
    <circle cx="980" cy="230" r="7" fill="#c084fc" filter="url(#glow)"/>
    <circle cx="850" cy="190" r="9" fill="#f43f5e" filter="url(#glow)"/>
    
    <!-- Dynamic Pulsing Nodes -->
    <circle cx="975" cy="135" class="pulse-circle" fill="#38bdf8"/>
  </g>

  <!-- Left Dynamic Search Glass Visual -->
  <g opacity="0.15">
    <circle cx="120" cy="150" r="90" fill="none" stroke="#818cf8" stroke-width="3"/>
    <circle cx="120" cy="150" r="60" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8,6"/>
    <line x1="183" y1="213" x2="250" y2="280" stroke="#818cf8" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Main Content -->
  <g transform="translate(80, 0)">
    <!-- Header Icon / Tag -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="220" height="32" rx="16" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
      <text x="110" y="21" text-anchor="middle" class="badge-text">⚡ CURATED ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="140" class="title" filter="url(#glow)">Awesome Product Discovery 🔍</text>
    
    <!-- Subtitle -->
    <text x="0" y="185" class="subtitle">E-Commerce Search, Personalization, Merchandising &amp; AI Recommendations</text>
    
    <!-- Feature Pill Badges -->
    <g transform="translate(0, 220)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="65" y="19" text-anchor="middle" class="badge-text" fill="#38bdf8">🛒 SaaS Leaders</text>

      <!-- Pill 2 -->
      <rect x="145" y="0" width="165" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="227" y="19" text-anchor="middle" class="badge-text" fill="#a855f7">⭐ Open-Source Repos</text>

      <!-- Pill 3 -->
      <rect x="325" y="0" width="160" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="405" y="19" text-anchor="middle" class="badge-text" fill="#4ade80">🤖 AI &amp; Vector Search</text>
    </g>
  </g>
</svg>
